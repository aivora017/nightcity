# nightcity — kitty

font_family      JetBrainsMono Nerd Font
font_size        11.5
disable_ligatures never

background            #08090a
foreground            #e1e4e6
background_opacity    0.86
window_padding_width  14
hide_window_decorations yes
confirm_os_window_close 0

cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_trail          3

scrollback_lines      5000
enable_audio_bell     no
visual_bell_duration  0.08
url_style             curly

tab_bar_style         powerline
tab_powerline_style   slanted

# fixed colours: red, green, yellow keep their meaning on every wallpaper
color0   #1a1d23
color8   #4c5359
color1   #e0556b
color9   #ff7a8a
color2   #3ee0a1
color10  #6cf0bf
color3   #e6a351
color11  #f5c07a
color7   #c7ccd0
color15  #ffffff

# adaptive colours (blue, magenta, cyan, cursor, selection) come from nc-wall
include nc-colors.conf
