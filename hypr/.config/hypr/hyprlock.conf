# nightcity — lock screen, matches the SDDM greeter
source = ~/.config/hypr/lock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ncOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, ncOut
    animation = fadeOut, 1, 4, ncOut
    animation = inputFieldDots, 1, 2, ncOut
}

background {
    monitor =
    path = $WALL
    blur_passes = 3
    blur_size = 6
    brightness = 0.35
    contrast = 0.95
    vibrancy = 0.2
}

# corner brackets
shape {
    monitor =
    size = 46, 2
    color = $ACCENT
    position = -47%, 45%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 2, 46
    color = $ACCENT
    position = -49.4%, 43.5%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 46, 2
    color = $ACCENT
    position = 47%, -45%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 2, 46
    color = $ACCENT
    position = 49.4%, -43.5%
    halign = center
    valign = center
}

# top status line
label {
    monitor =
    text = cmd[update:60000] echo "NIGHTCITY SECURE TERMINAL  ·  $(date '+%A %d %B' | tr '[:lower:]' '[:upper:]')"
    color = rgba(200, 215, 230, 0.55)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -34
    halign = center
    valign = top
}

# clock
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = Michroma
    position = 0, 90
    halign = center
    valign = center
}

# system line, read from the last health scan
label {
    monitor =
    text = cmd[update:30000] echo "SYS $(sed -n 's/.*"score": \([0-9]*\).*/\1/p' ~/.cache/nightcity/health.json 2>/dev/null || echo '--')  ·  UP $(uptime -p | sed 's/up //')"
    color = $ACCENT
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = AWAITING IDENTITY
    color = rgba(200, 215, 230, 0.5)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -78
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $ACCENT
    inner_color = rgba(20, 24, 34, 0.75)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_color = $ACCENT2
    fail_color = rgb(ff5470)
    fail_text = ACCESS DENIED
    placeholder_text = password
    rounding = 25
    shadow_passes = 2
    position = 0, -130
    halign = center
    valign = center
}
